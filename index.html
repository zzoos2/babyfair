<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>베이비페어 스마트 네비게이터</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800;900&display=swap');
    * { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; }
    html, body { width: 100%; height: 100%; overflow: hidden; touch-action: none; background-color: #0f172a; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* 인터랙티브 타일 */
    .booth-tile {
      position: absolute;
      cursor: pointer;
      box-sizing: border-box;
      border-radius: 4px;
      transition: background-color 0.15s ease, opacity 0.15s ease, border-color 0.15s ease;
      background: transparent;
      z-index: 10;
    }
    
    /* 검색 및 필터 시 활성화 타일 */
    .booth-tile.active-booth {
      background: rgba(124, 58, 237, 0.22) !important;
      border: 3px solid #7c3aed !important;
      box-shadow: 0 0 12px rgba(124, 58, 237, 0.9) !important;
      z-index: 20;
    }
    .booth-tile.active-event {
      background: rgba(225, 29, 72, 0.25) !important;
      border: 3px solid #e11d48 !important;
      box-shadow: 0 0 14px rgba(225, 29, 72, 0.95) !important;
      z-index: 20;
    }
    
    /* 비활성화 부스 암전 처리 (원본 도면에서 비선택 부스만 가려짐) */
    .booth-tile.dimmed {
      background: rgba(15, 23, 42, 0.72) !important;
      border: 1px solid rgba(255, 255, 255, 0.1) !important;
      opacity: 0.92 !important;
    }

    .bottom-sheet-transition { transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
  </style>
</head>
<body class="relative w-screen h-screen flex flex-col justify-between overflow-hidden">

  <!-- 검색 및 필터 헤더 -->
  <header class="absolute top-0 inset-x-0 z-30 p-2 sm:p-3 pointer-events-none">
    <div class="max-w-md mx-auto space-y-2 pointer-events-auto">
      <div class="bg-white/95 backdrop-blur-md rounded-2xl shadow-xl border border-slate-200 p-2 flex items-center gap-2">
        <div class="w-8 h-8 rounded-xl bg-slate-900 flex items-center justify-center text-white shrink-0 shadow-sm">
          <i data-lucide="compass" class="w-4 h-4"></i>
        </div>
        <div class="relative flex-1">
          <i data-lucide="search" class="w-3.5 h-3.5 text-slate-400 absolute left-2.5 top-1/2 -translate-y-1/2"></i>
          <input id="searchInput" type="text" placeholder="업체, 부스번호, 품목 (예: 아기띠, 젖병, D170)" 
                 class="w-full pl-8 pr-7 py-1.5 bg-slate-100 rounded-xl text-xs sm:text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-purple-500 transition"
                 oninput="handleSearch(this.value)">
          <button id="clearSearchBtn" onclick="clearSearch()" class="hidden absolute right-2 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
            <i data-lucide="x" class="w-3.5 h-3.5"></i>
          </button>
        </div>
        <button onclick="resetMapView()" class="p-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-600 text-xs flex items-center gap-1 font-medium" title="전체지도 보기">
          <i data-lucide="maximize" class="w-4 h-4"></i>
        </button>
      </div>

      <div class="flex items-center gap-1.5 overflow-x-auto hide-scrollbar py-0.5" id="filterPills"></div>
    </div>
  </header>

  <!-- 전체 복귀 버튼 -->
  <div id="focusedResetBar" class="hidden absolute top-28 sm:top-24 left-1/2 -translate-x-1/2 z-30 pointer-events-auto">
    <button onclick="resetMapView()" class="px-3.5 py-1.5 rounded-full bg-slate-900/90 hover:bg-slate-900 text-white text-xs font-bold shadow-xl border border-white/20 flex items-center gap-1.5 backdrop-blur-md active:scale-95 transition">
      <i data-lucide="maximize" class="w-3.5 h-3.5 text-purple-400"></i>
      <span>🗺️ 전체 지도로 돌아가기</span>
    </button>
  </div>

  <!-- 지도 메인 뷰포트 -->
  <main id="viewportContainer" class="relative w-full h-full bg-[#f8fafc] flex items-center justify-center overflow-hidden cursor-grab active:cursor-grabbing">
    <div id="mapTransformGroup" class="relative origin-top-left will-change-transform select-none" style="width: 2000px; height: 1150px;">
      
      <!-- 원본 이미지 레이어 (100% 동일한 도면) -->
      <img id="baseMapImg" src="map.png" alt="베이비페어 도면" class="absolute inset-0 w-full h-full object-contain pointer-events-none" />

      <!-- 인터랙티브 클릭 타일 레이어 -->
      <div id="boothOverlayContainer" class="absolute inset-0"></div>
    </div>

    <div class="absolute right-3 bottom-24 sm:bottom-28 z-20 flex flex-col gap-1.5 pointer-events-auto">
      <button onclick="zoomMap(1.25)" class="w-10 h-10 rounded-2xl bg-white/95 backdrop-blur-md shadow-md border border-slate-200 flex items-center justify-center text-slate-700 active:scale-95 transition">
        <i data-lucide="plus" class="w-5 h-5"></i>
      </button>
      <button onclick="zoomMap(0.8)" class="w-10 h-10 rounded-2xl bg-white/95 backdrop-blur-md shadow-md border border-slate-200 flex items-center justify-center text-slate-700 active:scale-95 transition">
        <i data-lucide="minus" class="w-5 h-5"></i>
      </button>
      <button onclick="resetMapView()" class="w-10 h-10 rounded-2xl bg-white/95 backdrop-blur-md shadow-md border border-slate-200 flex items-center justify-center text-purple-700 active:scale-95 transition" title="처음 위치로">
        <i data-lucide="refresh-cw" class="w-4 h-4"></i>
      </button>
    </div>
  </main>

  <!-- 하단 바텀 시트 -->
  <div id="bottomSheet" class="fixed inset-x-0 bottom-0 z-40 bg-white rounded-t-3xl shadow-2xl border-t border-slate-200 max-w-md mx-auto bottom-sheet-transition translate-y-[82%] flex flex-col max-h-[82vh]">
    <div onclick="toggleSheet()" class="pt-2.5 pb-2 px-4 cursor-pointer flex flex-col items-center bg-white rounded-t-3xl border-b border-slate-100">
      <div class="w-10 h-1.5 bg-slate-300 rounded-full mb-2"></div>
      <div class="w-full flex items-center justify-between">
        <div class="flex items-center gap-2">
          <span id="sheetBadgeCount" class="px-2 py-0.5 rounded-full bg-slate-900 text-white text-xs font-black">전체</span>
          <span id="sheetSummaryTitle" class="text-xs font-bold text-slate-800 truncate">🏢 전체 부스 리스트</span>
        </div>
        <div class="flex items-center gap-1 text-[11px] font-semibold text-purple-600">
          <span id="sheetToggleLabel">펼쳐서 리스트 보기</span>
          <i id="sheetChevron" data-lucide="chevron-up" class="w-4 h-4 transition-transform"></i>
        </div>
      </div>
    </div>

    <div id="sheetScrollContent" class="overflow-y-auto px-4 py-3 space-y-3 hide-scrollbar flex-1">
      <div id="focusedBoothDetail" class="hidden p-3.5 bg-gradient-to-br from-purple-50 via-white to-indigo-50/50 rounded-2xl border-2 border-purple-300 shadow-sm relative">
        <div class="flex items-start justify-between mb-1.5">
          <div>
            <div class="flex items-center gap-1.5 mb-1" id="singleBadges"></div>
            <h3 id="singleName" class="text-lg font-black text-slate-900 leading-tight">브랜드명</h3>
            <p id="singleCategory" class="text-xs text-slate-500 font-semibold">카테고리</p>
          </div>
          <div class="text-right flex flex-col items-end gap-1">
            <span id="singleId" class="inline-block bg-slate-900 text-white font-mono font-bold text-sm px-2.5 py-1 rounded-xl">D170</span>
            <button onclick="resetMapView()" class="px-2 py-1 rounded-lg bg-slate-100 hover:bg-purple-100 text-purple-700 text-[11px] font-bold flex items-center gap-1 transition">
              <i data-lucide="maximize" class="w-3 h-3"></i>
              <span>전체지도</span>
            </button>
          </div>
        </div>

        <div id="singleGeminiBox" class="mt-2 p-2.5 bg-purple-100/70 rounded-xl border border-purple-200">
          <div class="text-[11px] font-bold text-purple-900 flex items-center gap-1 mb-0.5">
            <span>✨ Gemini 추천 포인트</span>
          </div>
          <p id="singleGeminiTip" class="text-xs text-purple-800 font-medium leading-relaxed"></p>
        </div>

        <div id="singleEventBox" class="mt-2 p-2.5 bg-rose-50 rounded-xl border border-rose-200">
          <div class="text-[11px] font-bold text-rose-900 flex items-center gap-1 mb-0.5">
            <span>🎁 사은품 / 이벤트 혜택</span>
          </div>
          <div id="singleEventCondition" class="text-[11px] text-slate-600 font-medium mb-1"></div>
          <p id="singleEventDesc" class="text-xs text-rose-700 font-bold leading-relaxed"></p>
          <label class="mt-2 pt-2 border-t border-rose-200/60 flex items-center justify-between text-xs text-rose-900 font-semibold cursor-pointer">
            <span>사은품 수령 완료</span>
            <input type="checkbox" id="singleGiftCheck" onchange="toggleGiftCollected(selectedBoothId)" class="w-4 h-4 text-rose-600 accent-rose-600 rounded">
          </label>
        </div>

        <div class="mt-2.5">
          <span class="text-[10px] font-bold text-slate-400 uppercase">전시품목:</span>
          <div id="singleItems" class="flex flex-wrap gap-1 mt-1"></div>
        </div>

        <div class="mt-3 grid grid-cols-3 gap-1.5">
          <button id="singleBookmarkBtn" onclick="toggleBookmark(selectedBoothId)" class="py-2 rounded-xl border border-slate-300 bg-white font-bold text-xs flex items-center justify-center gap-1 text-slate-700">
            <i data-lucide="star" class="w-3.5 h-3.5"></i>
            <span>찜하기</span>
          </button>
          <button id="singleVisitedBtn" onclick="toggleVisited(selectedBoothId)" class="py-2 rounded-xl bg-slate-900 text-white font-bold text-xs flex items-center justify-center gap-1">
            <i data-lucide="check" class="w-3.5 h-3.5"></i>
            <span>방문 완료</span>
          </button>
          <button onclick="resetMapView()" class="py-2 rounded-xl bg-purple-600 hover:bg-purple-700 text-white font-bold text-xs flex items-center justify-center gap-1">
            <i data-lucide="map" class="w-3.5 h-3.5"></i>
            <span>전체보기</span>
          </button>
        </div>
      </div>

      <div class="space-y-2" id="boothListView"></div>
    </div>
  </div>

  <!-- 하단 탭 내비게이션 -->
  <footer class="absolute bottom-0 inset-x-0 z-50 bg-white/95 backdrop-blur-md border-t border-slate-200 py-2 px-3 shadow-lg pointer-events-auto">
    <div class="max-w-md mx-auto flex items-center justify-around">
      <button onclick="setFilter('all')" id="tab-all" class="flex flex-col items-center gap-0.5 text-slate-900 active:scale-95 transition">
        <i data-lucide="grid" class="w-4 h-4"></i>
        <span class="text-[10px] font-bold">전체 부스</span>
      </button>
      <button onclick="setFilter('gemini')" id="tab-gemini" class="flex flex-col items-center gap-0.5 text-slate-400 hover:text-purple-600 active:scale-95 transition">
        <i data-lucide="sparkles" class="w-4 h-4"></i>
        <span class="text-[10px] font-medium">Gemini 픽</span>
      </button>
      <button onclick="setFilter('event')" id="tab-event" class="flex flex-col items-center gap-0.5 text-slate-400 hover:text-rose-600 active:scale-95 transition">
        <i data-lucide="gift" class="w-4 h-4"></i>
        <span class="text-[10px] font-medium">이벤트 21선</span>
      </button>
      <button onclick="setFilter('myList')" id="tab-myList" class="flex flex-col items-center gap-0.5 text-slate-400 hover:text-slate-900 active:scale-95 transition relative">
        <div class="relative">
          <i data-lucide="clipboard-check" class="w-4 h-4"></i>
          <span id="badgeBookmarkCount" class="absolute -top-1 -right-2 bg-purple-600 text-white font-bold text-[8px] w-3.5 h-3.5 rounded-full flex items-center justify-center hidden">0</span>
        </div>
        <span class="text-[10px] font-medium">내 동선</span>
      </button>
    </div>
  </footer>

  <div id="toastBox" class="fixed top-16 left-1/2 -translate-x-1/2 z-50 bg-slate-900/90 text-white text-xs font-semibold px-4 py-2 rounded-full shadow-lg opacity-0 pointer-events-none transition-opacity duration-300">
    알림 메시지

      { id: "B200", name: "에그/아이카본", x: 1320, y: 640, w: 160, h: 125, cat: "유모차·카시트", isGemini: true, tip: "영국 프리미엄 명품 디럭스 유모차.", items: ["에그3 디럭스 유모차", "유모차", "카본 유모차"], event: null },
      { id: "B100", name: "어파베이비", x: 1520, y: 640, w: 155, h: 125, cat: "유모차·카시트", isGemini: true, tip: "미국 1위 프리미엄 유모차. 거대한 장바구니 수납력.", items: ["크루즈 V2", "비스타 유모차", "유모차", "턱받이"], event: { cond: "뽑기이벤트 / 목요일만 턱받이 증정", desc: "턱받이(목요일) & 뽑기 이벤트" } },
      { id: "A200", name: "에이블", x: 1715, y: 640, w: 125, h: 125, cat: "유모차·카시트", isGemini: false, items: ["트라이크", "푸쉬카", "유모차"], event: null }
    ];

    let currentFilter = 'all';
    let searchQuery = '';
    let selectedBoothId = null;
    let isSheetExpanded = false;

    let bookmarks = JSON.parse(localStorage.getItem('befe_bookmarks') || '[]');
    let visited = JSON.parse(localStorage.getItem('befe_visited') || '[]');
    let giftsCollected = JSON.parse(localStorage.getItem('befe_gifts') || '[]');

    let currentScale = 1;
    let panX = 0;
    let panY = 0;

    const FILTERS = [
      { id: 'all', label: '전체 부스', title: '🏢 전체 부스 리스트' },
      { id: 'gemini', label: '✨ Gemini 추천', title: '✨ Gemini 추천 필수 브랜드' },
      { id: 'event', label: '🎁 사은품 21선', title: '🎁 선착순 사은품 & 이벤트 부스' },
      { id: 'feed', label: '🍼 출산·수유', title: '🍼 출산·수유 위생용품' },
      { id: 'stroller', label: '🚼 유모차·카시트', title: '🚼 유모차 & 카시트 라인업' },
      { id: 'appliance', label: '🔌 가전·홈캠', title: '🔌 육아가전 & 스마트 홈캠' },
      { id: 'carrier', label: '🤱 아기띠·턱받이', title: '🤱 아기띠 & 턱받이' },
      { id: 'furniture', label: '🛋️ 가구·침구', title: '🛋️ 침대, 가구 & 매트' },
      { id: 'food', label: '🥣 이유식·식품', title: '🥣 이유식 & 건강식품' },
      { id: 'myList', label: '⭐ 내 체크리스트', title: '⭐ 내가 찜한 부스 & 동선' }
    ];

    window.addEventListener('DOMContentLoaded', () => {
      renderBoothOverlay();
      renderFilterPills();
      bindMapEvents();
      applyFilter();
      updateBadgeCounts();
      lucide.createIcons();
      fitMapToContainer();
    });

    function renderBoothOverlay() {
      const container = document.getElementById('boothOverlayContainer');
      container.innerHTML = BOOTHS.map(b => `
        <div class="booth-tile" id="booth-tile-${b.id}" data-id="${b.id}" 
             style="left: ${b.x}px; top: ${b.y}px; width: ${b.w}px; height: ${b.h}px;"
             onclick="focusAndSelectBooth('${b.id}')">
        </div>
      `).join('');
    }

    function renderFilterPills() {
      const container = document.getElementById('filterPills');
      container.innerHTML = FILTERS.map(f => {
        const isActive = f.id === currentFilter;
        let activeCls = isActive 
          ? (f.id === 'gemini' 
              ? 'bg-purple-600 text-white shadow-md shadow-purple-300 ring-2 ring-purple-300' 
              : 'bg-slate-900 text-white shadow')
          : 'bg-white/95 text-slate-700 hover:bg-slate-100 border border-slate-200/80 shadow-sm';
        return `
          <button onclick="setFilter('${f.id}')" 
                  class="shrink-0 px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1 ${activeCls}">
            <span>${f.label}</span>
          </button>
        `;
      }).join('');
    }

    function setFilter(filterId) {
      currentFilter = filterId;
      renderFilterPills();
      updateActiveNavTabs();
      applyFilter();
    }

    function updateActiveNavTabs() {
      ['all', 'gemini', 'event', 'myList'].forEach(id => {
        const btn = document.getElementById(`tab-${id}`);
        if (!btn) return;
        const text = btn.querySelector('span:last-child');
        if (currentFilter === id) {
          btn.className = "flex flex-col items-center gap-0.5 text-slate-900 active:scale-95 transition";
          if (text) text.className = "text-[10px] font-bold";
        } else {
          btn.className = "flex flex-col items-center gap-0.5 text-slate-400 hover:text-slate-800 active:scale-95 transition";
          if (text) text.className = "text-[10px] font-medium";
        }
      });
    }

    function getFilteredList() {
      return BOOTHS.filter(b => {
        if (searchQuery) {
          const q = searchQuery.toLowerCase().replace(/\s+/g, '');
          const matchName = b.name.toLowerCase().replace(/\s+/g, '').includes(q);
          const matchId = b.id.toLowerCase().replace(/\s+/g, '').includes(q);
          const matchCat = b.cat.toLowerCase().replace(/\s+/g, '').includes(q);
          const matchItems = b.items.some(i => i.toLowerCase().replace(/\s+/g, '').includes(q));
          const matchTip = b.tip ? b.tip.toLowerCase().replace(/\s+/g, '').includes(q) : false;
          if (!matchName && !matchId && !matchCat && !matchItems && !matchTip) return false;
        }

        if (currentFilter === 'all') return true;
        if (currentFilter === 'gemini') return b.isGemini;
        if (currentFilter === 'event') return b.event !== null;
        if (currentFilter === 'feed') return b.cat.includes('출산') || b.cat.includes('수유');
        if (currentFilter === 'stroller') return b.cat.includes('유모차') || b.cat.includes('카시트');
        if (currentFilter === 'appliance') return b.cat.includes('가전') || b.cat.includes('홈캠');
        if (currentFilter === 'carrier') return b.cat.includes('아기띠') || b.cat.includes('턱받이');
        if (currentFilter === 'furniture') return b.cat.includes('가구') || b.cat.includes('침구');
        if (currentFilter === 'food') return b.cat.includes('이유식') || b.cat.includes('식품');
        if (currentFilter === 'myList') return bookmarks.includes(b.id) || visited.includes(b.id);
        return true;
      });
    }

    function applyFilter() {
      const filtered = getFilteredList();
      const filteredIds = new Set(filtered.map(b => b.id));

      const filterConf = FILTERS.find(f => f.id === currentFilter) || FILTERS[0];
      document.getElementById('sheetBadgeCount').innerText = `${filtered.length}개`;
      document.getElementById('sheetSummaryTitle').innerText = searchQuery 
        ? `🔍 '${searchQuery}' 검색 결과` 
        : filterConf.title;

      document.querySelectorAll('.booth-tile').forEach(el => {
        const id = el.getAttribute('data-id');
        el.classList.remove('active-booth', 'active-event', 'dimmed');

        if (searchQuery !== '' || currentFilter !== 'all') {
          if (filteredIds.has(id)) {
            const boothObj = BOOTHS.find(b => b.id === id);
            if (boothObj && boothObj.event) {
              el.classList.add('active-event');
            } else {
              el.classList.add('active-booth');
            }
          } else {
            el.classList.add('dimmed');
          }
        }
      });

      renderBottomSheetList(filtered);
    }

    function handleSearch(val) {
      searchQuery = val.trim();
      const clearBtn = document.getElementById('clearSearchBtn');
      if (clearBtn) {
        if (searchQuery) clearBtn.classList.remove('hidden');
        else clearBtn.classList.add('hidden');
      }
      applyFilter();
    }

    function clearSearch() {
      const input = document.getElementById('searchInput');
      if (input) input.value = '';
      handleSearch('');
    }

    function renderBottomSheetList(filtered) {
      const container = document.getElementById('boothListView');
      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="py-8 text-center text-slate-400">
            <i data-lucide="package-search" class="w-8 h-8 mx-auto mb-1 opacity-50"></i>
            <p class="text-xs">조건에 맞는 부스가 없습니다</p>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      container.innerHTML = filtered.map(b => {
        const isBookmarked = bookmarks.includes(b.id);
        const isVisited = visited.includes(b.id);
        const isSelected = selectedBoothId === b.id;

        return `
          <div onclick="focusAndSelectBooth('${b.id}')" 
               class="p-3 bg-white rounded-2xl border ${isSelected ? 'border-purple-500 ring-2 ring-purple-100' : 'border-slate-200'} shadow-sm flex items-start justify-between cursor-pointer hover:bg-slate-50 transition active:scale-[0.99] ${isVisited ? 'opacity-60 bg-slate-50' : ''}">
            <div class="space-y-1 pr-2 flex-1">
              <div class="flex items-center gap-1.5 flex-wrap">
                <span class="px-2 py-0.5 rounded-lg bg-slate-900 text-white font-mono font-bold text-xs">${b.id}</span>
                <span class="font-black text-sm text-slate-900 ${isVisited ? 'line-through text-slate-400' : ''}">${b.name}</span>
                ${b.isGemini ? '<span class="px-1.5 py-0.5 rounded-md bg-purple-100 text-purple-700 text-[10px] font-bold">✨Gemini</span>' : ''}
              </div>
              
              ${b.tip ? `<p class="text-[11px] text-purple-700 font-medium leading-snug line-clamp-1">💡 ${b.tip}</p>` : ''}
              ${b.event ? `<p class="text-[11px] text-rose-600 font-bold leading-snug">🎁 ${b.event.desc}</p>` : ''}
              <p class="text-[10px] text-slate-400 truncate">품목: ${b.items.join(', ')}</p>
            </div>

            <div class="flex items-center gap-1 shrink-0 pt-1" onclick="event.stopPropagation()">
              <button onclick="toggleBookmark('${b.id}')" class="p-1.5 text-slate-300 hover:text-amber-500">
                <i data-lucide="star" class="w-4 h-4 ${isBookmarked ? 'fill-amber-400 text-amber-500' : ''}"></i>
              </button>
              <button onclick="toggleVisited('${b.id}')" class="p-1.5 ${isVisited ? 'text-emerald-600' : 'text-slate-300'}">
                <i data-lucide="check-circle" class="w-4 h-4 ${isVisited ? 'fill-emerald-100 text-emerald-600' : ''}"></i>
              </button>
            </div>
          </div>
        `;
      }).join('');
      lucide.createIcons();
    }

    function focusAndSelectBooth(boothId) {
      selectedBoothId = boothId;
      const b = BOOTHS.find(item => item.id === boothId);
      if (!b) return;

      const centerX = b.x + b.w / 2;
      const centerY = b.y + b.h / 2;
      focusOnCoordinate(centerX, centerY, 2.2);

      const resetBar = document.getElementById('focusedResetBar');
      if (resetBar) resetBar.classList.remove('hidden');

      const singleCard = document.getElementById('focusedBoothDetail');
      singleCard.classList.remove('hidden');

      document.getElementById('singleId').innerText = b.id;
      document.getElementById('singleName').innerText = b.name;
      document.getElementById('singleCategory').innerText = `${b.cat} 전문`;

      const badgesContainer = document.getElementById('singleBadges');
      badgesContainer.innerHTML = '';
      if (b.isGemini) {
        badgesContainer.innerHTML += `<span class="px-2 py-0.5 rounded-full bg-purple-100 text-purple-800 text-[10px] font-bold">✨ Gemini's Pick</span>`;
      }
      if (b.event) {
        badgesContainer.innerHTML += `<span class="px-2 py-0.5 rounded-full bg-rose-100 text-rose-800 text-[10px] font-bold">🎁 사은품/이벤트</span>`;
      }

      const geminiBox = document.getElementById('singleGeminiBox');
      if (b.tip) {
        geminiBox.classList.remove('hidden');
        document.getElementById('singleGeminiTip').innerText = b.tip;
      } else {
        geminiBox.classList.add('hidden');
      }

      const eventBox = document.getElementById('singleEventBox');
      if (b.event) {
        eventBox.classList.remove('hidden');
        document.getElementById('singleEventCondition').innerText = b.event.cond ? `📌 조건: ${b.event.cond}` : '';
        document.getElementById('singleEventDesc').innerText = `혜택: ${b.event.desc}`;
        document.getElementById('singleGiftCheck').checked = giftsCollected.includes(b.id);
      } else {
        eventBox.classList.add('hidden');
      }

      document.getElementById('singleItems').innerHTML = b.items.map(it => 
        `<span class="px-2 py-0.5 bg-slate-100 text-slate-700 text-[10px] rounded-lg font-medium">${it}</span>`
      ).join('');

      updateSingleModalButtons(b.id);
      setSheetExpanded(true);
      lucide.createIcons();
    }

    function clearFocusedBooth() {
      selectedBoothId = null;
      document.getElementById('focusedBoothDetail').classList.add('hidden');
      const resetBar = document.getElementById('focusedResetBar');
      if (resetBar) resetBar.classList.add('hidden');
      setSheetExpanded(false);
      applyFilter();
    }

    function updateSingleModalButtons(boothId) {
      const isBookmarked = bookmarks.includes(boothId);
      const isVisited = visited.includes(boothId);

      const starBtn = document.getElementById('singleBookmarkBtn');
      const visitedBtn = document.getElementById('singleVisitedBtn');

      if (isBookmarked) {
        starBtn.className = "py-2 rounded-xl border border-amber-300 bg-amber-50 font-bold text-xs flex items-center justify-center gap-1 text-amber-700";
        starBtn.innerHTML = `<i data-lucide="star" class="w-3.5 h-3.5 fill-amber-400 text-amber-500"></i><span>찜 취소</span>`;
      } else {
        starBtn.className = "py-2 rounded-xl border border-slate-300 bg-white font-bold text-xs flex items-center justify-center gap-1 text-slate-700";
        starBtn.innerHTML = `<i data-lucide="star" class="w-3.5 h-3.5"></i><span>찜하기</span>`;
      }

      if (isVisited) {
        visitedBtn.className = "py-2 rounded-xl bg-emerald-600 text-white font-bold text-xs flex items-center justify-center gap-1";
        visitedBtn.innerHTML = `<i data-lucide="check-circle" class="w-3.5 h-3.5"></i><span>방문 취소</span>`;
      } else {
        visitedBtn.className = "py-2 rounded-xl bg-slate-900 text-white font-bold text-xs flex items-center justify-center gap-1";
        visitedBtn.innerHTML = `<i data-lucide="check" class="w-3.5 h-3.5"></i><span>방문 완료</span>`;
      }
      lucide.createIcons();
    }

    function toggleBookmark(boothId) {
      if (!boothId) return;
      if (bookmarks.includes(boothId)) {
        bookmarks = bookmarks.filter(id => id !== boothId);
        showToast("찜 목록에서 제거되었습니다.");
      } else {
        bookmarks.push(boothId);
        showToast("★ 내 체크리스트에 찜했습니다!");
      }
      localStorage.setItem('befe_bookmarks', JSON.stringify(bookmarks));
      updateBadgeCounts();
      updateSingleModalButtons(boothId);
      applyFilter();
    }

    function toggleVisited(boothId) {
      if (!boothId) return;
      if (visited.includes(boothId)) {
        visited = visited.filter(id => id !== boothId);
        showToast("방문 완료 상태가 해제되었습니다.");
      } else {
        visited.push(boothId);
        showToast("✓ 방문 완료 체크되었습니다.");
      }
      localStorage.setItem('befe_visited', JSON.stringify(visited));
      updateSingleModalButtons(boothId);
      applyFilter();
    }

    function toggleGiftCollected(boothId) {
      if (!boothId) return;
      if (giftsCollected.includes(boothId)) {
        giftsCollected = giftsCollected.filter(id => id !== boothId);
      } else {
        giftsCollected.push(boothId);
        showToast("🎁 사은품 수령 완료 체크!");
      }
      localStorage.setItem('befe_gifts', JSON.stringify(giftsCollected));
      applyFilter();
    }

    function updateBadgeCounts() {
      const badge = document.getElementById('badgeBookmarkCount');
      if (bookmarks.length > 0) {
        badge.innerText = bookmarks.length;
        badge.classList.remove('hidden');
      } else {
        badge.classList.add('hidden');
      }
    }

    function showToast(msg) {
      const toast = document.getElementById('toastBox');
      toast.innerText = msg;
      toast.classList.remove('opacity-0');
      setTimeout(() => { toast.classList.add('opacity-0'); }, 1800);
    }

    function toggleSheet() {
      setSheetExpanded(!isSheetExpanded);
    }

    function setSheetExpanded(expanded) {
      isSheetExpanded = expanded;
      const sheet = document.getElementById('bottomSheet');
      const label = document.getElementById('sheetToggleLabel');
      const chevron = document.getElementById('sheetChevron');

      if (expanded) {
        sheet.classList.remove('translate-y-[82%]');
        sheet.classList.add('translate-y-[20%]');
        label.innerText = '접어서 지도 보기';
        chevron.classList.add('rotate-180');
      } else {
        sheet.classList.remove('translate-y-[20%]');
        sheet.classList.add('translate-y-[82%]');
        label.innerText = '펼쳐서 리스트 보기';
        chevron.classList.remove('rotate-180');
      }
    }

    // 모바일 터치 제스처 엔진 (핀치 줌 & 1핑거 팬)
    const container = document.getElementById('viewportContainer');
    const transformGroup = document.getElementById('mapTransformGroup');

    let isPanning = false;
    let startX = 0, startY = 0;
    let initialDistance = 0;
    let initialScale = 1;

    function bindMapEvents() {
      container.addEventListener('mousedown', (e) => {
        if (e.target.closest('.booth-tile') || e.target.closest('button')) return;
        isPanning = true;
        startX = e.clientX - panX;
        startY = e.clientY - panY;
      });

      window.addEventListener('mousemove', (e) => {
        if (!isPanning) return;
        panX = e.clientX - startX;
        panY = e.clientY - startY;
        updateTransform();
      });

      window.addEventListener('mouseup', () => { isPanning = false; });

      container.addEventListener('wheel', (e) => {
        e.preventDefault();
        const factor = e.deltaY < 0 ? 1.15 : 0.85;
        zoomMap(factor);
      }, { passive: false });

      container.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
          isPanning = true;
          startX = e.touches[0].clientX - panX;
          startY = e.touches[0].clientY - panY;
        } else if (e.touches.length === 2) {
          isPanning = false;
          initialDistance = getTouchDistance(e.touches);
          initialScale = currentScale;
        }
      }, { passive: true });

      container.addEventListener('touchmove', (e) => {
        if (e.touches.length === 1 && isPanning) {
          panX = e.touches[0].clientX - startX;
          panY = e.touches[0].clientY - startY;
          updateTransform();
        } else if (e.touches.length === 2) {
          const newDistance = getTouchDistance(e.touches);
          if (initialDistance > 0) {
            const factor = newDistance / initialDistance;
            currentScale = Math.min(Math.max(initialScale * factor, 0.4), 4.5);
            updateTransform();
          }
        }
      }, { passive: true });

      container.addEventListener('touchend', (e) => {
        if (e.touches.length === 0) isPanning = false;
      });
    }

    function getTouchDistance(touches) {
      const dx = touches[0].clientX - touches[1].clientX;
      const dy = touches[0].clientY - touches[1].clientY;
      return Math.sqrt(dx * dx + dy * dy);
    }

    function updateTransform() {
      transformGroup.style.transform = `translate(${panX}px, ${panY}px) scale(${currentScale})`;
    }

    function zoomMap(factor) {
      const nextScale = Math.min(Math.max(currentScale * factor, 0.4), 4.5);
      const cx = window.innerWidth / 2, cy = window.innerHeight / 2;
      panX = cx - (cx - panX) * (nextScale / currentScale);
      panY = cy - (cy - panY) * (nextScale / currentScale);
      currentScale = nextScale;
      updateTransform();
    }

    function focusOnCoordinate(svgX, svgY, targetScale = 2.2) {
      currentScale = targetScale;
      panX = (window.innerWidth / 2) - svgX * targetScale;
      panY = (window.innerHeight / 2) - svgY * targetScale;
      updateTransform();
    }

    function fitMapToContainer() {
      const scaleX = window.innerWidth / 2000;
      const scaleY = window.innerHeight / 1150;
      currentScale = Math.min(scaleX, scaleY) * 0.95;
      panX = (window.innerWidth - 2000 * currentScale) / 2;
      panY = (window.innerHeight - 1150 * currentScale) / 2;
      updateTransform();
    }

    function resetMapView() {
      fitMapToContainer();
      clearFocusedBooth();
      showToast("전체 지도로 복귀했습니다.");
    }
  </script>
</body>
